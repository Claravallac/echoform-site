<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="priv.meta">Política de Privacidade — Echoform</title>
<meta name="robots" content="index, follow">
<link rel="canonical" href="privacidade.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100f13;
    --bg-raise: #17161b;
    --card: #1c1a20;
    --card-border: #2c2933;
    --ink: #e9e5ee;
    --ink-dim: #a79fb0;
    --ink-faint: #766e7f;
    --primary: #c9b6ff;
    --primary-strong: #a684ff;
    --on-primary: #2a1857;
    --primary-container: #453072;
    --tertiary: #f3b6c9;
    --tertiary-container: #5a3244;
    --rule: #2a2731;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 560px at 18% -10%, color-mix(in srgb, var(--primary-container) 38%, transparent), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--tertiary-container) 30%, transparent), transparent 55%),
      var(--bg);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- nav ---------- */

  header.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px;
    max-width: 880px;
    margin: 0 auto;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -.2px;
    flex-shrink: 0;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  nav.links {
    display: flex;
    gap: 22px;
    font-size: 13.5px;
    color: var(--ink-dim);
  }

  nav.links a { text-decoration: none; transition: color .15s ease; }
  nav.links a:hover { color: var(--ink); }

  /* ---------- lang switch ---------- */

  .lang-switch {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }

  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3px;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }

  .lang-switch button[aria-pressed="true"] {
    background: var(--primary);
    color: var(--on-primary);
  }

  .lang-switch button:not([aria-pressed="true"]):hover {
    color: var(--ink);
  }


  /* ---------- termos de uso ---------- */

  .terms-list { display: grid; gap: 12px; }

  .term-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 20px 19px;
  }

  .term-item .term-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: color-mix(in srgb, var(--primary) 16%, transparent);
    color: var(--primary);
    font-size: 11.5px; font-weight: 700;
    margin-right: 10px; flex: none;
  }

  .term-item h3 {
    display: flex; align-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15.5px; font-weight: 600; letter-spacing: -.2px;
    margin: 0 0 9px;
  }

  .term-item p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.7;
  }

  .terms-links {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 18px;
  }

  .terms-links a {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--ink-dim);
    font-size: 13px; font-weight: 500;
    text-decoration: none;
    transition: color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .terms-links a:hover {
    color: var(--ink);
    border-color: color-mix(in srgb, var(--primary) 45%, var(--card-border));
    background: color-mix(in srgb, var(--primary) 8%, var(--card));
  }
  .terms-links a svg { flex: none; opacity: .8; }

  .terms-foot {
    margin: 22px 0 0;
    color: var(--ink-faint);
    font-size: 12.5px;
    line-height: 1.6;
  }

  /* ---------- footer ---------- */

  footer {
    border-top: 1px solid var(--rule);
    padding: 32px 24px 40px;
  }

  footer .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  footer a {
    color: var(--ink-dim);
    text-decoration: none;
  }
  footer a:hover { color: var(--ink); }

  .foot-links { display: flex; gap: 18px; }

  .foot-made {
    flex-basis: 100%;
    text-align: center;
    margin: 10px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    color: var(--ink-dim);
    font-size: 13px;
  }
  .foot-made strong { color: var(--ink); font-weight: 600; }
  .foot-heart {
    display: inline-block;
    color: var(--tertiary);
    transform-origin: center;
    vertical-align: -2px;
    margin-left: 2px;
  }
  .foot-heart svg { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .foot-heart { animation: heart-beat 2.4s ease-in-out infinite; }
    @keyframes heart-beat {
      0%, 60%, 100% { transform: scale(1); }
      12% { transform: scale(1.22); }
      24% { transform: scale(1); }
      36% { transform: scale(1.14); }
    }
  }

  
  
  section { padding: 48px 24px 72px; max-width: 880px; margin: 0 auto; }
  .section-head { margin-bottom: 30px; }
  .section-head h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 700; letter-spacing: -1px; line-height: 1.1;
    margin: 0 0 12px;
  }
  .section-head p { color: var(--ink-dim); font-size: 15px; line-height: 1.6; margin: 0; max-width: 620px; }
  .updated {
    display: inline-block; margin-top: 14px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--card-border); background: var(--card);
    color: var(--ink-faint); font-size: 12px; font-weight: 500;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    border: 1px solid transparent; transition: background-color .15s ease, border-color .15s ease;
  }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-strong); }
  .btn-ghost { color: var(--ink); border-color: var(--card-border); }
  .btn-ghost:hover { border-color: var(--ink-faint); background: var(--bg-raise); }

  .toc {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 16px 20px 18px; margin-bottom: 14px;
  }
  .toc h2 { margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 13px;
    text-transform: uppercase; letter-spacing: .8px; color: var(--ink-faint); font-weight: 600; }
  .toc ol { margin: 0; padding-left: 0; list-style: none; columns: 2; column-gap: 28px; }
  .toc li { font-size: 13.5px; line-height: 1.9; color: var(--ink-dim); break-inside: avoid; }
  .toc a { text-decoration: none; }
  .toc a:hover { color: var(--primary); }

  .term-item { scroll-margin-top: 20px; }
  .term-item p + p, .term-item p + ul, .term-item ul + p { margin-top: 10px; }
  .term-item ul { margin: 0; padding-left: 20px; color: var(--ink-dim); font-size: 14px; line-height: 1.7; }
  .term-item li { margin-bottom: 4px; }
  .term-item strong { color: var(--ink); font-weight: 600; }
  .term-item a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
  .term-item a:hover { color: var(--ink); }
  .term-item code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    padding: 1px 6px; border-radius: 5px; color: var(--primary);
  }

  .callout {
    border: 1px solid color-mix(in srgb, var(--primary) 40%, var(--card-border));
    background: color-mix(in srgb, var(--primary) 9%, var(--card));
    border-radius: 14px; padding: 16px 20px; margin-bottom: 14px;
    font-size: 14px; line-height: 1.65; color: var(--ink);
  }
  .callout strong { color: var(--primary); }

  .cross { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  @media (max-width: 640px) {
    nav.links { display: none; }
    .toc ol { columns: 1; }
  }

</style>
</head>

<script>
(function () {
  var I18N = {"pt-BR": {"nav.home": "Início", "nav.terms": "Termos", "nav.privacy": "Privacidade", "footer.disclaimer": "Echoform — projeto independente, sem vínculo oficial com o Musixmatch.", "footer.made": "Feito com amor por <strong>Himari</strong>", "common.updated": "Última atualização: 21 de setembro de 2026 (Echoform 4.0.0)", "common.toc": "Nesta página", "common.back": "Voltar ao site", "common.seePrivacy": "Ver Política de Privacidade", "common.seeTerms": "Ver Termos de Uso", "priv.meta": "Política de Privacidade — Echoform", "priv.title": "Política de Privacidade", "priv.subtitle": "Esta política explica, de forma direta, quais dados o Echoform (extensão de navegador) acessa, onde eles ficam guardados, quais permissões ele pede e o que nunca acontece com eles.", "priv.callout": "<strong>Resumo:</strong> o Echoform guarda seus dados <strong>localmente, no seu navegador</strong>, e não usa análise, telemetria nem publicidade. Os backups em nuvem (Firebase) e no Google Drive são <strong>opcionais e só acontecem se você ativar ou pedir</strong>. A extensão <strong>não captura nem armazena letras de músicas</strong>.", "priv.s1.title": "1. Quais dados o Echoform acessa", "priv.s1.body": "<p>O Echoform é uma extensão que funciona <strong>apenas</strong> nas páginas do Musixmatch Curators Studio. Para oferecer as funções descritas no site, ela lê informações que já estão sendo exibidas pelo Studio no seu navegador:</p><ul><li><strong>Dados das músicas que você envia:</strong> título, artista, missão, capa, duração da faixa, data e horário do envio.</li><li><strong>Dados de ganhos por missão:</strong> valores exibidos pela plataforma, usados para calcular totais e resumos.</li><li><strong>Preferências e perfil:</strong> tema, idioma, moeda, opções do painel e a foto/capa de curator que o Studio já exibe (guardadas só localmente).</li><li><strong>Texto colado no Diff Check:</strong> o Diff Check é manual — ele compara apenas o texto que <em>você mesmo cola</em> na janela. Esse texto fica somente na memória da aba enquanto a janela está aberta; não é salvo, exportado nem enviado a lugar nenhum.</li></ul><p>A extensão <strong>não lê, não captura e não armazena o texto de letras</strong> exibido pelo Studio. Também <strong>não</strong> coleta senhas, dados de pagamento, e-mail, endereço, localização, histórico de navegação nem qualquer conteúdo fora do Musixmatch Curators Studio.</p>", "priv.s2.title": "2. Onde os dados ficam guardados", "priv.s2.body": "<p>Por padrão, todos os dados listados acima ficam <strong>localmente no seu dispositivo</strong>, no armazenamento da própria extensão/navegador (<code>storage</code> / <code>localStorage</code>). Se você desinstalar a extensão ou limpar os dados dela pelo navegador, eles são apagados.</p><p>Existem três formas de backup, todas <strong>opcionais</strong> — você escolhe se e quando usar:</p><ul><li><strong>Arquivo no seu computador:</strong> um arquivo <code>.json</code> salvo pelo recurso de downloads do navegador.</li><li><strong>Google Drive:</strong> após você entrar com a sua conta Google, um arquivo de backup é criado <strong>no seu próprio Drive</strong>. O acesso é limitado aos arquivos criados pelo Echoform (escopo <code>drive.file</code>); a extensão não lê seus outros arquivos.</li><li><strong>Nuvem do Echoform:</strong> uma cópia do seu log de envios, dos resumos mensais e das configurações (sem foto e capa de curator) é enviada ao <strong>Firestore, no projeto Firebase (Google) do Echoform</strong>, vinculada a um identificador de conta (anônimo ou o da sua conta Google). O desenvolvedor administra esse projeto. Esses dados servem <strong>somente</strong> para restaurar o seu backup e não são usados para análise, publicidade nem vendidos ou compartilhados.</li></ul><p>Os backups gerados a partir da versão 4.0.0 <strong>não incluem texto de letras</strong>, e backups antigos que ainda contenham letras têm esse texto descartado ao serem importados.</p><p><strong>Versões anteriores à 4.0.0:</strong> essas versões podiam capturar letras e guardá-las nos backups, e também permitiam compartilhar diffs por link. Backups na nuvem ou no Drive criados por elas <em>podem</em> ainda conter texto de letras; você pode apagá-los (o do Drive, diretamente na sua conta; o da nuvem do Echoform, conforme a seção 6). Os diffs compartilhados por link eram temporários e são removidos automaticamente da nuvem após cerca de 30 dias.</p>", "priv.s3.title": "3. Para que os dados são usados", "priv.s3.body": "<p>Os dados são usados <strong>exclusivamente</strong> para fazer a extensão funcionar para você: montar o histórico de envios, calcular ganhos, gerar ciclos e resumos mensais, comparar os textos que você cola no Diff Check, buscar prévias de áudio, fazer e restaurar os backups que você pedir e lembrar suas configurações.</p><p>Os dados <strong>não</strong> são usados para publicidade, criação de perfis, análise de comportamento, determinação de crédito ou qualquer finalidade alheia ao funcionamento da extensão.</p>", "priv.s4.title": "4. Serviços externos e terceiros", "priv.s4.body": "<p>O desenvolvedor <strong>não vende, aluga, transfere nem compartilha</strong> seus dados com terceiros. Não há SDKs de análise, rastreadores, anúncios ou telemetria na extensão.</p><p>A extensão faz conexões a serviços externos para recursos pontuais. Como em qualquer requisição na internet, esses serviços podem ver o seu endereço IP. O que é enviado em cada caso:</p><ul><li><strong>Cotação de moedas</strong> (<code>economia.awesomeapi.com.br</code>): apenas o par de moedas consultado, para converter USD na moeda escolhida. Nenhum dado seu é enviado.</li><li><strong>Bandeiras de moedas</strong> (<code>hatscripts.github.io</code>, projeto aberto circle-flags): imagens públicas, apenas para exibição.</li><li><strong>Prévia de áudio</strong> (iTunes Search API, da Apple, e API da Deezer): para buscar a prévia de uma faixa, o <strong>título e o artista dela</strong> são enviados a esses serviços como termo de busca.</li><li><strong>Atualizações</strong> (API do GitHub e página da extensão no addons.mozilla.org): consulta pública de versão e notas de lançamento. Nenhum dado seu é enviado.</li><li><strong>Login Google e backups</strong> (Google/Firebase e Google Drive): usados <strong>somente se você ativar</strong> os backups em nuvem ou no Drive; o que é enviado é o conteúdo do backup, descrito na seção 2.</li></ul><p>Esses serviços têm suas próprias políticas de privacidade, das quais o Echoform não é parte.</p>", "priv.s5.title": "5. Permissões da extensão", "priv.s5.body": "<p>As permissões solicitadas ao navegador servem <strong>apenas</strong> para o funcionamento descrito nesta política:</p><ul><li><strong>Acesso ao site do Musixmatch Curators Studio</strong> (<code>curators.musixmatch.com</code> e <code>curators-beta.musixmatch.com</code>): necessário para ler as informações exibidas na tela e mostrar o painel, os botões e o Diff Check ali.</li><li><strong>Armazenamento (<code>storage</code>):</strong> para guardar localmente seu histórico e suas configurações.</li><li><strong>Downloads (<code>downloads</code>):</strong> para salvar no seu computador o arquivo de backup.</li><li><strong>Notificações (<code>notifications</code>):</strong> para mostrar uma notificação do sistema quando um envio é registrado, se você ativar essa opção.</li><li><strong>Menus de contexto (<code>contextMenus</code>):</strong> para os atalhos do menu de contexto (clique direito) da extensão.</li><li><strong>Identidade (<code>identity</code>):</strong> para o login com a sua conta Google, usado apenas nos backups em nuvem e no Drive.</li><li><strong>Acesso a serviços externos:</strong> <code>economia.awesomeapi.com.br</code>, <code>itunes.apple.com</code>, <code>api.deezer.com</code>, <code>api.github.com</code>, <code>addons.mozilla.org</code>, <code>identitytoolkit.googleapis.com</code>, <code>securetoken.googleapis.com</code>, <code>firestore.googleapis.com</code> e <code>www.googleapis.com</code>, para as conexões listadas na seção 4.</li></ul><p>A extensão não injeta código em outros sites e não lê abas que não sejam do Musixmatch Curators Studio.</p>", "priv.s6.title": "6. Seu controle sobre os dados", "priv.s6.body": "<p>Você tem controle sobre os dados locais. A qualquer momento pode <strong>exportar, editar ou apagar</strong> os dados pelo painel da própria extensão, ou removê-los por completo desinstalando a extensão ou limpando os dados do site/extensão pelo navegador. Os backups automáticos podem ser desativados nas configurações.</p><p><strong>Backups fora do seu dispositivo:</strong> o arquivo salvo no computador e o arquivo no seu Google Drive estão sob o seu controle — você pode apagá-los, e pode revogar o acesso do Echoform à sua conta Google nas configurações de segurança do Google. Para <strong>pedir a exclusão do seu backup na nuvem do Echoform</strong>, abra uma solicitação no repositório do projeto (seção 9).</p>", "priv.s7.title": "7. Crianças", "priv.s7.body": "<p>O Echoform é voltado a curadores do Musixmatch Curators Studio e não se destina a menores de 13 anos. Não coletamos intencionalmente informações de crianças.</p>", "priv.s8.title": "8. Alterações desta política", "priv.s8.body": "<p>Esta política pode ser atualizada para refletir mudanças na extensão ou na lei. A data da última atualização e a versão da extensão a que ela se refere aparecem no topo da página. Mudanças relevantes serão indicadas nesta mesma página.</p>", "priv.s9.title": "9. Contato", "priv.s9.body": "<p>Dúvidas sobre privacidade? Abra uma solicitação no repositório do projeto: <a href=\"https://github.com/Claravallac/mxm-studio-log-de-envios/issues\" target=\"_blank\" rel=\"noopener noreferrer\">github.com/Claravallac/mxm-studio-log-de-envios</a>.</p><p>Esta política vale para o Echoform nas versões publicadas na Chrome Web Store e no Firefox (addons.mozilla.org).</p>", "terms.meta": "Termos de Uso — Echoform", "terms.title": "Termos de Uso e Avisos Legais", "terms.subtitle": "Os mesmos avisos que a extensão mostra na primeira vez que é aberta — leia antes de instalar.", "terms.s1.title": "1. Natureza do projeto", "terms.s1.body": "<p>Esta é uma extensão independente e sem fins lucrativos, desenvolvida por um curador para auxiliar outros curadores a organizar e acompanhar seu próprio tempo e atividade dentro do Musixmatch Studio.</p>", "terms.s2.title": "2. Funcionamento", "terms.s2.body": "<p>A extensão não utiliza, acessa ou se conecta à API oficial da Musixmatch. Todo o seu funcionamento se limita à leitura e à medição de informações já exibidas na tela pelo navegador do próprio usuário, sem interceptar, automatizar ou alterar o envio de conteúdo em nome do curador. Não foi desenvolvida com o propósito de fraudar, burlar ou conceder qualquer vantagem indevida nos processos de curadoria ou premiação da plataforma.</p>", "terms.s3.title": "3. Uso permitido", "terms.s3.body": "<p>Você pode usar o Echoform gratuitamente, para fins pessoais, respeitando os Termos de Uso da própria Musixmatch. É proibido usar a extensão para violar regras da plataforma, ou redistribuí-la fingindo ser um produto oficial da Musixmatch.</p>", "terms.s4.title": "4. Isenção de responsabilidade", "terms.s4.body": "<p>O uso desta extensão é de inteira responsabilidade do usuário. O desenvolvedor não se responsabiliza por eventual mau uso da ferramenta, por decisões tomadas com base nas informações exibidas, nem por quaisquer consequências, penalidades, suspensões ou perdas decorrentes do uso da extensão. A extensão é fornecida “como está”, sem garantias de qualquer tipo.</p>", "terms.s5.title": "5. Marcas registradas", "terms.s5.body": "<p>“Musixmatch”, seu logotipo e demais marcas relacionadas são de propriedade exclusiva da Musixmatch. Esta extensão não é um produto oficial, não é afiliada, patrocinada ou endossada pela empresa — é um projeto independente feito apenas para ajudar o curador a gerenciar melhor seu tempo na plataforma.</p>", "terms.s6.title": "6. Privacidade e alterações", "terms.s6.body": "<p>O tratamento de dados está descrito na <a href=\"privacidade.html\">Política de Privacidade</a>. Estes termos podem ser atualizados; continuar usando o Echoform após uma atualização significa concordar com a versão vigente.</p><p>Ao instalar e usar o Echoform, você declara ter lido e concordado com os termos e avisos acima.</p>", "terms.linkEula": "Termos de Uso (EULA) da Musixmatch", "terms.linkSupport": "Central de Ajuda da Musixmatch"}, "en": {"nav.home": "Home", "nav.terms": "Terms", "nav.privacy": "Privacy", "footer.disclaimer": "Echoform — an independent project, not officially affiliated with Musixmatch.", "footer.made": "Made with love by <strong>Himari</strong>", "common.updated": "Last updated: September 21, 2026 (Echoform 4.0.0)", "common.toc": "On this page", "common.back": "Back to site", "common.seePrivacy": "View Privacy Policy", "common.seeTerms": "View Terms of Use", "priv.meta": "Privacy Policy — Echoform", "priv.title": "Privacy Policy", "priv.subtitle": "This policy explains, plainly, what data the Echoform browser extension accesses, where it is stored, which permissions it requests, and what never happens to it.", "priv.callout": "<strong>Summary:</strong> Echoform stores your data <strong>locally, in your own browser</strong>, and uses no analytics, telemetry or advertising. Cloud (Firebase) and Google Drive backups are <strong>optional and only happen if you turn them on or request them</strong>. The extension <strong>does not capture or store song lyrics</strong>.", "priv.s1.title": "1. What data Echoform accesses", "priv.s1.body": "<p>Echoform is an extension that works <strong>only</strong> on Musixmatch Curators Studio pages. To provide the features described on the site, it reads information that Studio is already displaying in your browser:</p><ul><li><strong>Data about songs you submit:</strong> title, artist, mission, cover art, track duration, submission date and time.</li><li><strong>Earnings data per mission:</strong> values shown by the platform, used to compute totals and summaries.</li><li><strong>Preferences and profile:</strong> theme, language, currency, panel options, and the curator photo/cover that Studio already displays (kept locally only).</li><li><strong>Text pasted into Diff Check:</strong> Diff Check is manual — it compares only the text <em>you paste yourself</em> into its window. That text lives only in the tab's memory while the window is open; it is not saved, exported or sent anywhere.</li></ul><p>The extension <strong>does not read, capture or store the lyrics text</strong> shown by Studio. It also does <strong>not</strong> collect passwords, payment data, email, address, location, browsing history, or any content outside Musixmatch Curators Studio.</p>", "priv.s2.title": "2. Where the data is stored", "priv.s2.body": "<p>By default, all data listed above stays <strong>locally on your device</strong>, in the extension's/browser's own storage (<code>storage</code> / <code>localStorage</code>). If you uninstall the extension or clear its data in your browser, it is deleted.</p><p>There are three kinds of backup, all <strong>optional</strong> — you choose whether and when to use them:</p><ul><li><strong>File on your computer:</strong> a <code>.json</code> file saved through the browser's downloads feature.</li><li><strong>Google Drive:</strong> after you sign in with your Google account, a backup file is created <strong>in your own Drive</strong>. Access is limited to files created by Echoform (<code>drive.file</code> scope); the extension does not read your other files.</li><li><strong>Echoform cloud:</strong> a copy of your submission log, monthly summaries and settings (without the curator photo and cover) is sent to <strong>Firestore, in Echoform's Firebase (Google) project</strong>, tied to an account identifier (anonymous, or that of your Google account). The developer administers that project. This data is used <strong>only</strong> to restore your backup and is not used for analytics or advertising, nor sold or shared.</li></ul><p>Backups created from version 4.0.0 <strong>do not include lyrics text</strong>, and older backups that still contain lyrics have that text discarded when imported.</p><p><strong>Versions before 4.0.0:</strong> those versions could capture lyrics and store them in backups, and also let you share diffs by link. Cloud or Drive backups created by them <em>may</em> still contain lyrics text; you can delete them (the Drive one directly in your account; the Echoform cloud one as described in section 6). Diffs shared by link were temporary and are automatically removed from the cloud after about 30 days.</p>", "priv.s3.title": "3. What the data is used for", "priv.s3.body": "<p>The data is used <strong>solely</strong> to make the extension work for you: building your submission history, calculating earnings, generating cycles and monthly summaries, comparing the texts you paste into Diff Check, fetching audio previews, making and restoring the backups you ask for, and remembering your settings.</p><p>The data is <strong>not</strong> used for advertising, profiling, behavioral analysis, creditworthiness, or any purpose unrelated to the extension's functionality.</p>", "priv.s4.title": "4. External services and third parties", "priv.s4.body": "<p>The developer does <strong>not sell, rent, transfer, or share</strong> your data with third parties. There are no analytics SDKs, trackers, ads, or telemetry in the extension.</p><p>The extension connects to external services for specific features. As with any internet request, these services may see your IP address. What is sent in each case:</p><ul><li><strong>Currency rates</strong> (<code>economia.awesomeapi.com.br</code>): only the currency pair requested, to convert USD to your chosen currency. None of your data is sent.</li><li><strong>Currency flags</strong> (<code>hatscripts.github.io</code>, the open circle-flags project): public images, for display only.</li><li><strong>Audio previews</strong> (Apple's iTunes Search API and the Deezer API): to look up a track's preview, the <strong>track title and artist</strong> are sent to these services as a search term.</li><li><strong>Updates</strong> (GitHub API and the extension's page on addons.mozilla.org): public version and release-notes lookups. None of your data is sent.</li><li><strong>Google sign-in and backups</strong> (Google/Firebase and Google Drive): used <strong>only if you turn on</strong> cloud or Drive backups; what is sent is the backup content described in section 2.</li></ul><p>These services have their own privacy policies, to which Echoform is not a party.</p>", "priv.s5.title": "5. Extension permissions", "priv.s5.body": "<p>The permissions requested from the browser are used <strong>only</strong> for the functionality described in this policy:</p><ul><li><strong>Access to the Musixmatch Curators Studio site</strong> (<code>curators.musixmatch.com</code> and <code>curators-beta.musixmatch.com</code>): required to read the information shown on screen and to display the panel, buttons and Diff Check there.</li><li><strong>Storage (<code>storage</code>):</strong> to keep your history and settings locally.</li><li><strong>Downloads (<code>downloads</code>):</strong> to save the backup file to your computer.</li><li><strong>Notifications (<code>notifications</code>):</strong> to show a system notification when a submission is logged, if you enable that option.</li><li><strong>Context menus (<code>contextMenus</code>):</strong> for the extension's context-menu (right-click) shortcuts.</li><li><strong>Identity (<code>identity</code>):</strong> for signing in with your Google account, used only for cloud and Drive backups.</li><li><strong>Access to external services:</strong> <code>economia.awesomeapi.com.br</code>, <code>itunes.apple.com</code>, <code>api.deezer.com</code>, <code>api.github.com</code>, <code>addons.mozilla.org</code>, <code>identitytoolkit.googleapis.com</code>, <code>securetoken.googleapis.com</code>, <code>firestore.googleapis.com</code> and <code>www.googleapis.com</code>, for the connections listed in section 4.</li></ul><p>The extension does not inject code into other sites and does not read tabs that are not Musixmatch Curators Studio.</p>", "priv.s6.title": "6. Your control over the data", "priv.s6.body": "<p>You are in control of your local data. At any time you can <strong>export, edit, or delete</strong> it from the extension's own panel, or remove it entirely by uninstalling the extension or clearing site/extension data in your browser. Automatic backups can be turned off in the settings.</p><p><strong>Backups outside your device:</strong> the file saved on your computer and the file in your Google Drive are under your control — you can delete them, and you can revoke Echoform's access to your Google account in Google's security settings. To <strong>request deletion of your Echoform cloud backup</strong>, open a request in the project repository (section 9).</p>", "priv.s7.title": "7. Children", "priv.s7.body": "<p>Echoform is aimed at Musixmatch Curators Studio curators and is not intended for children under 13. We do not knowingly collect information from children.</p>", "priv.s8.title": "8. Changes to this policy", "priv.s8.body": "<p>This policy may be updated to reflect changes in the extension or the law. The date of the last update, and the extension version it refers to, appear at the top of the page. Significant changes will be noted on this same page.</p>", "priv.s9.title": "9. Contact", "priv.s9.body": "<p>Privacy questions? Open a request in the project repository: <a href=\"https://github.com/Claravallac/mxm-studio-log-de-envios/issues\" target=\"_blank\" rel=\"noopener noreferrer\">github.com/Claravallac/mxm-studio-log-de-envios</a>.</p><p>This policy applies to Echoform as published on the Chrome Web Store and on Firefox (addons.mozilla.org).</p>", "terms.meta": "Terms of Use — Echoform", "terms.title": "Terms of Use and Legal Notices", "terms.subtitle": "The same notices the extension shows the first time it is opened — please read them before installing.", "terms.s1.title": "1. Nature of the project", "terms.s1.body": "<p>This is an independent, non-profit extension, built by a curator to help other curators organize and track their own time and activity within Musixmatch Studio.</p>", "terms.s2.title": "2. How it works", "terms.s2.body": "<p>This extension does not use, access, or connect to the official Musixmatch API. It works solely by reading and measuring information already shown on screen by the user’s own browser, without intercepting, automating, or altering submissions on the curator’s behalf. It was not built to defraud, bypass, or grant any unfair advantage in the platform’s curation or reward processes.</p>", "terms.s3.title": "3. Permitted use", "terms.s3.body": "<p>You may use Echoform free of charge, for personal purposes, while respecting Musixmatch’s own Terms of Use. You may not use the extension to violate platform rules, or redistribute it pretending to be an official Musixmatch product.</p>", "terms.s4.title": "4. Disclaimer of liability", "terms.s4.body": "<p>Use of this extension is entirely the user’s own responsibility. The developer is not liable for any misuse of the tool, for decisions made based on the information displayed, or for any consequences, penalties, suspensions, or losses arising from its use. The extension is provided “as is”, without warranties of any kind.</p>", "terms.s5.title": "5. Trademarks", "terms.s5.body": "<p>“Musixmatch”, its logo, and related trademarks are the exclusive property of Musixmatch. This extension is not an official product and is not affiliated with, sponsored by, or endorsed by the company — it is an independent project made only to help curators manage their time on the platform.</p>", "terms.s6.title": "6. Privacy and changes", "terms.s6.body": "<p>Data handling is described in the <a href=\"privacidade.html\">Privacy Policy</a>. These terms may be updated; continuing to use Echoform after an update means you accept the current version.</p><p>By installing and using Echoform, you confirm that you have read and agree to the terms and notices above.</p>", "terms.linkEula": "Musixmatch Terms of Use (EULA)", "terms.linkSupport": "Musixmatch Help Center"}};
  var STORAGE_KEY = 'echoform_lang';
  var htmlRoot = document.getElementById('html-root');

  function detectDefaultLang() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'pt-BR' || saved === 'en') return saved;
    } catch (e) {}
    var nav = (navigator.language || 'en').toLowerCase();
    return nav.indexOf('pt') === 0 ? 'pt-BR' : 'en';
  }

  function applyLang(lang) {
    var dict = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var v = dict[el.getAttribute('data-i18n')];
      if (v === undefined) return;
      if (el.tagName === 'TITLE') document.title = v; else el.innerHTML = v;
    });
    htmlRoot.setAttribute('lang', lang === 'pt-BR' ? 'pt-BR' : 'en');
    document.querySelectorAll('.lang-switch button').forEach(function (b) {
      var on = (b.getAttribute('data-lang') === 'pt') === (lang === 'pt-BR');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
  }

  document.querySelectorAll('.lang-switch button').forEach(function (b) {
    b.addEventListener('click', function () {
      applyLang(b.getAttribute('data-lang') === 'pt' ? 'pt-BR' : 'en');
    });
  });
  applyLang(detectDefaultLang());
})();
</script>
